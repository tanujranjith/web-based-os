<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <title>NovaOS</title>
    <link rel="icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./vendor/system.css" />
  </head>
  <body>
    <div id="boot-screen" class="boot-screen">
      <div class="boot-logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64"
          width="64"
          height="64"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="boot-g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#bdd19f" />
              <stop offset="1" stop-color="#46613b" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" fill="url(#boot-g)" />
          <text
            x="32"
            y="43"
            text-anchor="middle"
            font-family="system-ui"
            font-weight="700"
            font-size="32"
            fill="white"
          >
            N
          </text>
        </svg>
      </div>
      <div class="boot-name">NovaOS</div>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>

    <main id="os" class="os" hidden>
      <div id="wallpaper" class="wallpaper"></div>

      <section id="desktop" class="desktop" aria-label="Desktop">
        <div id="desktop-icons" class="desktop-icons"></div>
        <div id="desktop-widgets" class="desktop-widgets"></div>
      </section>

      <section id="windows" class="windows" aria-label="Windows"></section>

      <section id="launcher" class="launcher" hidden aria-label="App launcher">
        <div class="launcher-backdrop" data-close="launcher"></div>
        <div class="launcher-panel" role="dialog" aria-modal="true">
          <div class="launcher-search">
            <span class="launcher-search-icon" aria-hidden="true">⌕</span>
            <input
              id="launcher-input"
              type="search"
              placeholder="Search apps, files, settings…"
              autocomplete="off"
              spellcheck="false"
            />
            <kbd class="launcher-kbd">Esc</kbd>
          </div>
          <div id="launcher-grid" class="launcher-grid"></div>
        </div>
      </section>

      <section
        id="notification-center"
        class="notification-center"
        hidden
        aria-label="Notification center"
      >
        <div class="nc-backdrop" data-close="nc"></div>
        <aside class="nc-panel" role="dialog" aria-modal="true">
          <header class="nc-header">
            <h2>Notifications</h2>
            <button id="nc-clear" class="nc-clear">Clear all</button>
          </header>
          <div id="nc-list" class="nc-list"></div>
          <div class="nc-quick">
            <h3>Quick settings</h3>
            <div class="nc-quick-grid">
              <button data-quick="theme">Theme</button>
              <button data-quick="reduce-motion">Motion</button>
              <button data-quick="wallpaper">Wallpaper</button>
              <button data-quick="reset">Reset</button>
            </div>
          </div>
        </aside>
      </section>

      <section
        id="context-menu"
        class="context-menu"
        hidden
        role="menu"
      ></section>

      <footer id="dock" class="dock" aria-label="Dock">
        <button
          id="dock-launcher"
          class="dock-btn dock-launcher"
          title="App launcher (Ctrl/Cmd+Space)"
          aria-label="Open launcher"
        >
          <span class="dock-launcher-grid" aria-hidden="true">
            <span></span><span></span><span></span> <span></span><span></span
            ><span></span> <span></span><span></span><span></span>
          </span>
        </button>
        <div class="dock-divider"></div>
        <div id="dock-pinned" class="dock-items"></div>
        <div class="dock-divider"></div>
        <div id="dock-running" class="dock-items dock-running"></div>
        <div class="dock-spacer"></div>
        <div class="dock-tray" id="dock-tray">
          <span id="tray-net" class="tray-stat" title="Network">●</span>
          <span
            id="tray-battery"
            class="tray-stat"
            hidden
            title="Battery"
          ></span>
          <button
            id="tray-notifications"
            class="tray-btn"
            title="Notifications"
            aria-label="Notifications"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 2a7 7 0 0 0-7 7v3.586L3.293 14.293A1 1 0 0 0 4 16h16a1 1 0 0 0 .707-1.707L19 12.586V9a7 7 0 0 0-7-7zm0 20a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22z"
              />
            </svg>
            <span id="tray-notif-dot" class="tray-dot" hidden></span>
          </button>
          <button
            id="tray-clock"
            class="tray-clock"
            title="Clock"
            aria-label="Clock"
          >
            <span id="tray-time">--:--</span>
            <span id="tray-date" class="tray-date">—</span>
          </button>
        </div>
      </footer>

      <div id="notifications-toasts" class="toasts" aria-live="polite"></div>
    </main>

    <script type="module" src="./src/main.js"></script>
    <noscript>
      <div
        style="
          padding: 2rem;
          font-family: system-ui;
          color: #fff;
          background: #111;
          height: 100vh;
        "
      >
        NovaOS requires JavaScript. Please enable it to use this experience.
      </div>
    </noscript>
  </body>
</html>
